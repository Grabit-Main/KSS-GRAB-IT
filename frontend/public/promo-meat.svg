<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="woodBoard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D5B4C"/>
      <stop offset="30%" stop-color="#6B3E31"/>
      <stop offset="70%" stop-color="#4A281E"/>
      <stop offset="100%" stop-color="#2D160E"/>
    </linearGradient>
    <linearGradient id="woodRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A06A59"/>
      <stop offset="100%" stop-color="#3A1E15"/>
    </linearGradient>

    <radialGradient id="steakBase" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="40%" stop-color="#DC2626"/>
      <stop offset="75%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </radialGradient>

    <radialGradient id="chickenBase" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="25%" stop-color="#FFE4E6"/>
      <stop offset="60%" stop-color="#FDA4AF"/>
      <stop offset="90%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </radialGradient>

    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="garlicGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#450A0A" flood-opacity="0.35"/>
    </filter>
    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Ambient Shadow -->
  <ellipse cx="200" cy="235" rx="160" ry="30" fill="url(#groundShadow)"/>

  <!-- 1. WOODEN CUTTING BOARD BASE -->
  <g filter="url(#dropShadow)">
    <ellipse cx="200" cy="210" rx="145" ry="46" fill="url(#woodRim)"/>
    <ellipse cx="200" cy="205" rx="145" ry="44" fill="url(#woodBoard)" stroke="#A06A59" stroke-width="2.5"/>
    <ellipse cx="200" cy="204" rx="133" ry="38" fill="none" stroke="#3A1E15" stroke-width="2" opacity="0.6"/>
    <path d="M70,205 Q200,225 330,205" fill="none" stroke="#2D160E" stroke-width="1.5" opacity="0.35"/>
    <path d="M90,195 Q200,215 310,195" fill="none" stroke="#5D3A2E" stroke-width="1.2" opacity="0.3"/>
  </g>

  <!-- 2. FRESH RAW BEEF STEAK -->
  <g filter="url(#softShadow)">
    <path d="M85,160 C70,125 125,95 190,120 C235,138 220,190 165,200 C115,210 90,185 85,160 Z" 
          fill="url(#steakBase)" stroke="#FFF1F2" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M85,160 C70,125 125,95 190,120" 
          fill="none" stroke="#FFF1F2" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M85,160 C70,125 125,95 190,120" 
          fill="none" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M110,145 Q145,162 185,150" fill="none" stroke="#FFF1F2" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M125,172 Q155,182 192,170" fill="none" stroke="#FFF1F2" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M100,160 Q122,168 140,162" fill="none" stroke="#FFF1F2" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M160,135 Q175,142 195,138" fill="none" stroke="#FFF1F2" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <ellipse cx="140" cy="140" rx="35" ry="15" fill="#FFFFFF" opacity="0.25" transform="rotate(-15 140 140)"/>
  </g>

  <!-- 3. FRESH CHICKEN DRUMSTICK -->
  <g filter="url(#softShadow)">
    <path d="M255,165 L320,118" stroke="url(#boneGrad)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="324" cy="112" r="10" fill="url(#boneGrad)"/>
    <circle cx="332" cy="123" r="10" fill="url(#boneGrad)"/>
    <circle cx="320" cy="110" r="6" fill="#FFFFFF" opacity="0.8"/>
    <path d="M175,185 C160,150 205,120 250,140 C285,155 275,195 230,205 C195,212 180,200 175,185 Z" 
          fill="url(#chickenBase)"/>
    <ellipse cx="215" cy="160" rx="32" ry="18" fill="#FFFFFF" opacity="0.35" transform="rotate(-20 215 160)"/>
    <ellipse cx="235" cy="175" rx="18" ry="10" fill="#FFFFFF" opacity="0.25" transform="rotate(-10 235 175)"/>
  </g>

  <!-- 4. GARNISHES: ROSEMARY, GARLIC & PEPPERCORNS -->
  <g filter="url(#dropShadow)">
    <path d="M100,200 Q115,180 130,195 Q125,215 105,212 Z" fill="url(#garlicGrad)" stroke="#CA8A04" stroke-width="0.8"/>
  </g>

  <path d="M90,175 Q150,185 285,200" fill="none" stroke="#14532D" stroke-width="3.5" stroke-linecap="round"/>
  
  <path d="M130,212 L124,200 M132,212 L138,202" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M150,216 L144,204 M152,216 L158,206" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M170,218 L164,206 M172,218 L178,208" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M190,217 L184,205 M192,217 L198,207" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M210,213 L204,201 M212,213 L218,203" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M230,209 L224,197 M232,209 L238,199" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M250,205 L244,193 M252,205 L258,195" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="140" cy="225" r="4.5" fill="#1E293B"/>
  <circle cx="138" cy="223" r="1.5" fill="#94A3B8" opacity="0.8"/>
  <circle cx="158" cy="228" r="4" fill="#0F172A"/>
  <circle cx="156" cy="226" r="1.2" fill="#94A3B8" opacity="0.8"/>
  <circle cx="182" cy="226" r="5" fill="#1E293B"/>
  <circle cx="180" cy="224" r="1.5" fill="#94A3B8" opacity="0.8"/>
  <circle cx="235" cy="216" r="4" fill="#1E293B"/>
  <circle cx="233" cy="214" r="1.2" fill="#94A3B8" opacity="0.8"/>
  <circle cx="252" cy="212" r="4.5" fill="#0F172A"/>
  <circle cx="250" cy="210" r="1.5" fill="#94A3B8" opacity="0.8"/>
</svg>
