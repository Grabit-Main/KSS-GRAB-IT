<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <!-- Rich Deep Maroon Background Gradient -->
    <radialGradient id="bg-grad" cx="40%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#6B0918"/>
      <stop offset="50%" stop-color="#4A040F"/>
      <stop offset="100%" stop-color="#280106"/>
    </radialGradient>

    <!-- Shimmering Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE58F"/>
      <stop offset="30%" stop-color="#F5B041"/>
      <stop offset="70%" stop-color="#D4AC0D"/>
      <stop offset="100%" stop-color="#9A7D0A"/>
    </linearGradient>

    <!-- Terracotta Diya Body Gradient -->
    <linearGradient id="diya-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="50%" stop-color="#D35400"/>
      <stop offset="100%" stop-color="#7E5109"/>
    </linearGradient>

    <!-- Flame Glow Effect -->
    <radialGradient id="flame-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FF9800" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#E65100" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#BF360C" stop-opacity="0"/>
    </radialGradient>

    <!-- Flame Core Gradient -->
    <linearGradient id="flame-grad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#D84315"/>
      <stop offset="25%" stop-color="#F57C00"/>
      <stop offset="60%" stop-color="#FFD54F"/>
      <stop offset="95%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .flame-anim {
      transform-origin: 220px 220px;
      animation: flicker 1.8s ease-in-out infinite alternate;
    }
    .flame-glow-anim {
      transform-origin: 220px 220px;
      animation: pulseGlow 1.8s ease-in-out infinite alternate;
    }
    .hanging-lamp {
      animation: swing 3s ease-in-out infinite alternate;
      transform-origin: top center;
    }
    @keyframes flicker {
      0% { transform: scale(1) rotate(0deg); opacity: 0.95; }
      25% { transform: scale(1.04, 0.96) rotate(-1.5deg); opacity: 1; }
      50% { transform: scale(0.97, 1.05) rotate(1deg); opacity: 0.9; }
      75% { transform: scale(1.03, 0.98) rotate(-0.8deg); opacity: 0.98; }
      100% { transform: scale(1.02, 1.02) rotate(1.2deg); opacity: 1; }
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 0.95; }
      100% { transform: scale(1.02); opacity: 0.8; }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="450" fill="url(#bg-grad)"/>

  <!-- Background Watermark Mandala Patterns -->
  <g opacity="0.08" stroke="url(#gold-grad)" stroke-width="1.5" fill="none">
    <!-- Left Mandala -->
    <circle cx="220" cy="270" r="160"/>
    <circle cx="220" cy="270" r="120"/>
    <circle cx="220" cy="270" r="80"/>
    <circle cx="220" cy="270" r="40"/>
    <path d="M220 110 L220 430 M60 270 L380 270 M106 156 L333 383 M106 383 L333 156"/>
    <!-- Right Background Mandala -->
    <circle cx="1020" cy="225" r="260"/>
    <circle cx="1020" cy="225" r="200"/>
    <circle cx="1020" cy="225" r="140"/>
    <path d="M1020 -35 L1020 485 M760 225 L1280 225 M836 41 L1203 408 M836 408 L1203 41"/>
  </g>

  <!-- Ornate Golden Outer Frame Border -->
  <rect x="25" y="25" width="1150" height="400" rx="8" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.85"/>
  <rect x="33" y="33" width="1134" height="384" rx="6" fill="none" stroke="url(#gold-grad)" stroke-width="1" opacity="0.4"/>

  <!-- Four Corner Filigree Accents -->
  <!-- Top-Left Corner -->
  <g transform="translate(30, 30)" fill="url(#gold-grad)">
    <path d="M0,0 Q25,0 45,20 Q20,25 0,0 M0,0 Q0,25 20,45 Q25,20 0,0"/>
    <circle cx="12" cy="12" r="3.5"/>
  </g>
  <!-- Top-Right Corner -->
  <g transform="translate(1170, 30) scale(-1, 1)" fill="url(#gold-grad)">
    <path d="M0,0 Q25,0 45,20 Q20,25 0,0 M0,0 Q0,25 20,45 Q25,20 0,0"/>
    <circle cx="12" cy="12" r="3.5"/>
  </g>
  <!-- Bottom-Left Corner -->
  <g transform="translate(30, 420) scale(1, -1)" fill="url(#gold-grad)">
    <path d="M0,0 Q25,0 45,20 Q20,25 0,0 M0,0 Q0,25 20,45 Q25,20 0,0"/>
    <circle cx="12" cy="12" r="3.5"/>
  </g>
  <!-- Bottom-Right Corner -->
  <g transform="translate(1170, 420) scale(-1, -1)" fill="url(#gold-grad)">
    <path d="M0,0 Q25,0 45,20 Q20,25 0,0 M0,0 Q0,25 20,45 Q25,20 0,0"/>
    <circle cx="12" cy="12" r="3.5"/>
  </g>

  <!-- Hanging Golden Diyas / Lamps -->
  <!-- Lamp 1 -->
  <g class="hanging-lamp" transform="translate(480, 0)">
    <line x1="0" y1="0" x2="0" y2="130" stroke="url(#gold-grad)" stroke-width="1.5" stroke-dasharray="4 2"/>
    <path d="M-12 130 C-12 145 12 145 12 130 Z" fill="url(#gold-grad)"/>
    <circle cx="0" cy="126" r="3" fill="#FFF59D"/>
  </g>
  <!-- Lamp 2 -->
  <g class="hanging-lamp" transform="translate(520, 0)" style="animation-delay: 0.6s;">
    <line x1="0" y1="0" x2="0" y2="180" stroke="url(#gold-grad)" stroke-width="1.5" stroke-dasharray="4 2"/>
    <path d="M-15 180 C-15 198 15 198 15 180 Z" fill="url(#gold-grad)"/>
    <circle cx="0" cy="175" r="4" fill="#FFF59D"/>
  </g>
  <!-- Lamp 3 -->
  <g class="hanging-lamp" transform="translate(560, 0)" style="animation-delay: 1.2s;">
    <line x1="0" y1="0" x2="0" y2="110" stroke="url(#gold-grad)" stroke-width="1.5" stroke-dasharray="4 2"/>
    <path d="M-10 110 C-10 122 10 122 10 110 Z" fill="url(#gold-grad)"/>
    <circle cx="0" cy="107" r="2.5" fill="#FFF59D"/>
  </g>

  <!-- LEFT SIDE: GRAND GLOWING TRADITIONAL TERRACOTTA DIYA -->
  <g transform="translate(30, 20)">
    <!-- Shadow under Diya -->
    <ellipse cx="220" cy="335" rx="140" ry="22" fill="#000000" opacity="0.6"/>

    <!-- Radiant Outer Fire Halo -->
    <circle class="flame-glow-anim" cx="220" cy="190" r="130" fill="url(#flame-glow)"/>

    <!-- Diya Wick Stem -->
    <rect x="217" y="240" width="6" height="20" rx="3" fill="#2C1609"/>

    <!-- ANIMATED DIYA FLAME -->
    <g class="flame-anim">
      <!-- Outer Flame -->
      <path d="M220 90 Q255 170 238 245 Q220 260 202 245 Q185 170 220 90 Z" fill="url(#flame-grad)" filter="url(#glow-blur)"/>
      <!-- Inner Bright White Core -->
      <path d="M220 135 Q238 185 228 242 Q220 250 212 242 Q202 185 220 135 Z" fill="#FFFFFF"/>
    </g>

    <!-- Traditional Clay Diya Base -->
    <!-- Outer Clay Lip -->
    <path d="M70 260 C70 245 370 245 370 260 C370 325 290 340 220 340 C150 340 70 325 70 260 Z" fill="url(#diya-grad)" stroke="url(#gold-grad)" stroke-width="3" filter="url(#shadow)"/>
    <!-- Inner Bowl Oil Pool -->
    <ellipse cx="220" cy="260" rx="145" ry="20" fill="#3E1A00" stroke="#F39C12" stroke-width="2"/>
    <ellipse cx="220" cy="262" rx="135" ry="15" fill="#B9770E" opacity="0.8"/>

    <!-- Diya Ornate Engraved Pattern Details -->
    <path d="M90 280 Q220 310 350 280" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="130" cy="290" r="3" fill="url(#gold-grad)"/>
    <circle cx="170" cy="297" r="3" fill="url(#gold-grad)"/>
    <circle cx="220" cy="300" r="4" fill="url(#gold-grad)"/>
    <circle cx="270" cy="297" r="3" fill="url(#gold-grad)"/>
    <circle cx="310" cy="290" r="3" fill="url(#gold-grad)"/>
  </g>

  <!-- RIGHT SIDE: BRANDING & FESTIVE TYPOGRAPHY -->
  <g transform="translate(680, 0)">

    <!-- Company Badge / Quick Commerce Tag -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(255, 255, 255, 0.12)" stroke="url(#gold-grad)" stroke-width="1.5"/>
      <circle cx="20" cy="16" r="6" fill="#2ECC71"/>
      <text x="36" y="21" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="1">
        EXPRESS 10-MIN DELIVERY
      </text>
    </g>

    <!-- Company Name / Logo -->
    <g transform="translate(0, 185)">
      <!-- Grabit Brand Text -->
      <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="54" font-weight="900" fill="url(#gold-grad)" letter-spacing="-1" filter="url(#shadow)">
        Grabit
      </text>
      <!-- Sparkle Icon next to brand -->
      <path d="M175 -35 L180 -20 L195 -15 L180 -10 L175 5 L170 -10 L155 -15 L170 -20 Z" fill="#FFE082"/>
    </g>

    <!-- Main Festive Heading -->
    <text x="0" y="245" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      Happy Diwali
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="285" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="600" fill="#F9E79F" letter-spacing="3">
      FESTIVAL OF LIGHTS &amp; DELIGHTS
    </text>

    <!-- CTA Button Mockup -->
    <g transform="translate(0, 318)" class="cta-btn">
      <rect x="0" y="0" width="240" height="48" rx="24" fill="url(#gold-grad)" filter="url(#shadow)"/>
      <text x="120" y="30" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="900" fill="#3B0209" letter-spacing="1">
        SHOP DIWALI OFFERS &#8594;
      </text>
    </g>

  </g>
</svg>
